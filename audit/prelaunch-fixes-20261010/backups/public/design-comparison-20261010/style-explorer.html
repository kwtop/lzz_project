8px 0;white-space:nowrap;font-size:12px;text-decoration:underline;text-underline-offset:5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:28px}.card{min-width:0}.frame{position:relative;background:#fff;overflow:hidden;border:1px solid #ccd1d3;box-shadow:0 14px 32px -24px #00000065;transition:box-shadow .18s}.frame:hover{box-shadow:0 18px 38px -18px #00000045}.frame iframe{position:absolute;left:50%;top:0;border:0;transform-origin:top left;pointer-events:none}.frame>button{position:absolute;inset:0;width:100%;height:100%;cursor:zoom-in;z-index:2}.frame>button:focus-visible{outline-offset:-4px}.peek{position:absolute;bottom:0;left:0;right:0;padding:20px 14px 12px;color:#fff;background:linear-gradient(transparent,#0008);font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s}.frame:hover .peek,.frame:focus-within .peek{opacity:1}.card-caption{display:flex;align-items:center;gap:10px;margin-top:14px}.number{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.card h2{font-size:16px;font-weight:600}.swatches{display:flex;gap:3px;margin-left:auto}.swatches i{width:14px;height:14px;display:block;border:1px solid #00000012;border-radius:50%}.pick{margin-left:5px;padding:6px 12px;border:1px solid #b7bec2;border-radius:4px;font-size:12px;white-space:nowrap}.pick[aria-pressed=true]{background:#222;color:#fff;border-color:#222}.card>p{font-size:12px;color:var(--muted);margin-top:8px;max-width:40em}.card .type{font-size:11px;color:#7b8388;margin-top:6px}.footer{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;padding:10px 28px 32px;color:var(--muted);font-size:12px}.note-box{display:flex;align-items:center;gap:10px}.note-box textarea{width:360px;height:54px;resize:vertical;border:1px solid #cbd0d3;border-radius:4px;padding:9px 12px;background:#f9fafa;font-size:12px}.status{max-width:380px;padding-top:4px}.toast{position:fixed;z-index:100;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:6px;font-size:13px;max-width:calc(100vw - 32px)}.overlay{position:fixed;inset:0;z-index:40;background:#eeefef;display:flex;flex-direction:column}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;padding:10px 24px;background:#fafafa;border-bottom:1px solid var(--line)}.modal-head button{padding:7px 10px;border:1px solid var(--line);border-radius:4px;font-size:12px}.modal-head .seg button{border:0}.modal-title{font-weight:600;font-size:14px}.modal-body{display:grid;grid-template-columns:minmax(0,1fr) 288px;min-height:0;flex:1}.canvas{position:relative;overflow:auto;display:grid;justify-items:center;align-items:start;padding:26px;background:#e6e8e8}.single-frame{position:relative;flex:none;box-shadow:0 8px 36px #00000012;background:#fff}.single-frame iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left}.sidebar{overflow:auto;border-left:1px solid var(--line);background:#f8f9f9;padding:24px}.sidebar .directions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}.directions button{padding:7px 11px;border:1px solid #ccd2d5;border-radius:4px;font-size:12px}.directions button[aria-pressed=true]{background:#222;color:#fff;border-color:#222}.sidebar h2{font-size:22px;letter-spacing:-.03em;margin-bottom:12px}.sidebar p{font-size:13px;color:var(--muted);line-height:1.7}.sidebar h3{font-size:10px;letter-spacing:.1em;color:#8b9296;margin:26px 0 8px;font-weight:600}.palette{display:flex;gap:6px}.palette span{flex:1}.palette i{height:38px;display:block;border:1px solid #00000010;margin-bottom:7px}.palette small{font-size:10px;color:var(--muted)}.sidebar ul{padding-left:18px;color:var(--muted);font-size:13px;line-height:1.9}.sidebar>.pick{display:block;width:100%;margin:28px 0 0;padding:11px}.sidebar textarea{width:100%;min-height:86px;resize:vertical;border:1px solid var(--line);border-radius:4px;padding:10px;font-size:12px;background:#fff}.nav-buttons{display:flex;gap:6px}.modal-hint{font-size:11px;color:var(--muted);margin-top:12px}
@media(max-width:1000px){.toolbar{padding:12px 20px;gap:12px}.tools{gap:9px}.current{display:none}.grid{gap:16px;padding:24px 20px}.intro{padding:24px 20px 0}.card-caption{gap:7px;flex-wrap:wrap}.card h2{font-size:14px}.swatches{margin-left:0}.pick{margin-left:auto}.modal-body{grid-template-columns:minmax(0,1fr) 248px}.sidebar{padding:20px}.footer{padding-inline:20px}.note-box textarea{width:290px}}

<body>
<header class="toolbar"><div class="brand"><strong>LZZ</strong><span>DESIGN<br>DIRECTIONS / 01</span></div><div class="tools"><div class="seg" role="group" aria-label="预览尺寸"><button data-size="desktop" aria-pressed="true">桌面 1280</button><button data-size="mobile" aria-pressed="false">手机 390</button></div><details class="filter"><summary>比较范围</summary><div class="filters" id="filters"></div></details><button class="current" id="current" title="点击清除当前选择">尚未选择</button></div></header>
<section class="intro"><div><h1>三种方向，三种品牌表达。</h1><p>同一企业与询价目标，统一保留现站 Inter 字体，比较三种配色与构图。点击画面放大，向下滚动查看后续区块；选择会保存在此浏览器，选好后告诉我 A / B / C。</p></div><button id="baseline-button">查看当前首页 ↗</button></section>
<main class="grid" id="grid"></main>
<footer class="footer"><div class="note-box"><label for="notes">选择备注</label><textarea id="notes" placeholder="例如：选 B，但想保留 A 的能力列表。"></textarea></div><p class="status" id="storage-status">本轮为首页设计小样，素材来自现有项目；按钮用于浏览区块，尚未应用到现有网站。</p></footer>
<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-label="放大查看设计方向">
<div class="modal-head"><button id="close">← 返回并排</button><span class="modal-title" id="modal-title"></span><div class="seg" role="group" aria-label="单张预览尺寸"><button data-size="desktop" aria-pressed="true">桌面</button><button data-size="mobile" aria-pressed="false">手机</button><button id="actual" aria-pressed="false">100% 实际尺寸</button></div><div class="nav-buttons"><button id="prev" aria-label="上一个方向">←</button><button id="next" aria-label="下一个方向">→</button></div></div>
<div class="modal-body"><div class="canvas" id="canvas"><div class="single-frame" id="single-frame"></div></div><aside class="sidebar" id="sidebar"></aside></div>
</div><div id="toast" class="toast" role="status" hidden></div>
<script>
const candidates=[
{id:'a',name:'A · 工程品牌',src:'direction-a.html?v=inter-2',concept:'通栏大字先建立品牌，真实加工照片紧接证明能力。像工业品牌海报一样直接、有秩序。',font:'Inter Variable · 现站字体',palette:['#f0f2f3','#142129','#174bdf'],traits:['通栏大字与两行标题，突出工程秩序','钴蓝结构块连接双加工照片','能力用编号大行列，案例用加工/成品配对']},
{id:'b',name:'B · 零件策展',src:'direction-b.html?v=inter-2',concept:'把叶轮当作精密展品。由一件零件的形态，逐步展开材质、加工和工厂。',font:'Inter Variable · 现站字体',palette:['#f2ece0','#344536','#a9573b'],traits:['居中单一物件与上下标题','暖纸色、深橄榄和陶土动作色','目录式能力与错位编辑排版']},
{id:'c',name:'C · 加工现场',src:'direction-c.html?v=inter-2',concept:'让用户站在机床旁。真实加工画面承担首屏，工程流程和询价自然进入视线。',font:'Inter Variable · 现站字体',palette:['#082b32','#b8e5df','#e17b46'],traits:['满版加工照片，标题在图像安全区','深青、冰青与铜橙组成识别','连续工序带、宽幅加工案例与检验实拍']},
{id:'baseline',name:'现状 · 当前首页',src:'/',concept:'当前网站的实时首页，仅作参照；三个新方向尚未应用。',font:'Inter Variable',palette:['#181b1f','#ffffff','#e00b16'],traits:['现有居中标题首屏','原有图片与导航','原有网站功能'],baseline:true}
];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),sizes={desktop:{w:1280,h:900},mobile:{w:390,h:844}},key='lzz-design-20261010-v1';
let state={size:'desktop',visible:['a','b','c'],chosen:null,notes:''},currentId=null,actual=false,stored=true,toastTimer=null,returnFocus=null;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){if(['desktop','mobile'].includes(saved.size))state.size=saved.size;if(Array.isArray(saved.visible)&&saved.visible.some(id=>candidates.some(c=>c.id===id)))state.visible=saved.visible.filter(id=>candidates.some(c=>c.id===id));if(['a','b','c'].includes(saved.chosen))state.chosen=saved.chosen;if(typeof saved.notes==='string')state.notes=saved.notes;}}catch{stored=false;}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{stored=false;$('#storage-status').textContent='浏览器存储不可用；本轮选择仍会保留到页面关闭。选好后请直接告诉我 A / B / C。';}}
function say(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3600);}
function swatches(c){return '<div class="swatches" aria-label="配色">'+c.palette.map(color=>'<i style="background:'+color+'"></i>').join('')+'</div>';}
function chooseButton(c){return c.baseline?'':'<button class="pick" data-pick="'+c.id+'" aria-pressed="'+(state.chosen===c.id)+'">'+(state.chosen===c.id?'已选择':'选择 '+c.id.toUpperCase())+'</button>';}
function renderGrid(){const list=candidates.filter(c=>state.visible.includes(c.id));$('#grid').innerHTML=list.map(c=>'<article class="card" data-id="'+c.id+'"><div class="frame"><iframe src="'+c.src+'" title="'+c.name+'的设计预览" loading="eager" tabindex="-1"></iframe><button data-open="'+c.id+'" aria-label="放大查看'+c.name+'"></button><span class="peek">点击放大 · 可滚动查看整页</span></div><div class="card-caption"><span class="number">'+(c.baseline?'现状':c.id.toUpperCase())+'</span><h2>'+c.name.slice(c.baseline?0:4)+'</h2>'+swatches(c)+chooseButton(c)+'</div><p>'+c.concept+'</p><p class="type">'+c.font+'</p></article>').join('');requestAnimationFrame(fitCards);syncState();}
function fitCards(){const size=sizes[state.size];$$('.card .frame').forEach(frame=>{const available=frame.clientWidth,scale=Math.min(1,available/size.w);frame.style.height=Math.round(size.h*scale)+'px';const f=frame.querySelector('iframe');f.width=size.w;f.height=size.h;f.style.transform='translateX(-'+(size.w*scale/2)+'px) scale('+scale+')';});}
function syncState(){$$('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.size===state.size)));$$('[data-pick]').forEach(b=>{const selected=state.chosen===b.dataset.pick;b.setAttribute('aria-pressed',String(selected));b.textContent=selected?'已选择':'选择 '+b.dataset.pick.toUpperCase();});$('#current').textContent=state.chosen?'已选 '+state.chosen.toUpperCase()+' · '+candidates.find(c=>c.id===state.chosen).name.slice(4):'尚未选择';$$('#filters input').forEach(i=>i.checked=state.visible.includes(i.value));}
function renderSidebar(c){$('#sidebar').innerHTML='<div class="directions">'+candidates.map(x=>'<button data-switch="'+x.id+'" aria-pressed="'+(x.id===c.id)+'">'+(x.baseline?'现状':x.id.toUpperCase())+'</button>').join('')+'</div><h2>'+c.name+'</h2><p>'+c.concept+'</p><h3>TYPOGRAPHY / 字体</h3><p>'+c.font+'</p><h3>PALETTE / 配色</h3><div class="palette">'+c.palette.map(color=>'<span><i style="background:'+color+'"></i><small>'+color+'</small></span>').join('')+'</div><h3>COMPOSITION / 构图</h3><ul>'+c.traits.map(t=>'<li>'+t+'</li>').join('')+'</ul>'+chooseButton(c)+'<h3>YOUR NOTES / 选择备注</h3><textarea id="modal-notes" aria-label="单张查看的选择备注" placeholder="喜欢哪里，希望调整哪里"></textarea><p class="modal-hint">← → 切换 · P 选择 · Esc 返回。选择不会自动应用到网站。</p>';$('#modal-notes').value=state.notes;$('#modal-notes').addEventListener('input',e=>{state.notes=e.target.value;$('#notes').value=state.notes;save();});}
function open(id){const c=candidates.find(c=>c.id===id);if(!c)return;if($('#overlay').hidden)returnFocus=document.activeElement;currentId=id;$('#overlay').hidden=false;document.body.style.overflow='hidden';$('#modal-title').textContent=c.name;$('#single-frame').innerHTML='<iframe src="'+c.src+'" title="'+c.name+'完整页面"></iframe>';renderSidebar(c);const index=candidates.indexOf(c);$('#prev').disabled=index===0;$('#next').disabled=index===candidates.length-1;syncState();requestAnimationFrame(fitSingle);$('#close').focus();}
function fitSingle(){if($('#overlay').hidden)return;const size=sizes[state.size],canvas=$('#canvas'),pad=innerWidth<=700?24:52,availableW=canvas.clientWidth-pad,availableH=canvas.clientHeight-pad,scale=actual?1:Math.min(1,availableW/size.w,availableH/size.h),frame=$('#single-frame'),iframe=frame.querySelector('iframe');canvas.style.justifyItems=actual&&size.w>availableW?'start':'center';frame.style.width=Math.round(size.w*scale)+'px';frame.style.height=Math.round(size.h*scale)+'px';iframe.width=size.w;iframe.height=size.h;iframe.style.transform='scale('+scale+')';$('#actual').setAttribute('aria-pressed',String(actual));}
function close(){$('#overlay').hidden=true;document.body.style.overflow='';currentId=null;returnFocus?.focus();}
function move(delta){const i=candidates.findIndex(c=>c.id===currentId),next=candidates[i+delta];if(next)open(next.id);}
async function pick(id){if(!['a','b','c'].includes(id))return;state.chosen=id;save();syncState();const text='2026-10-10 / 01：选 '+id.toUpperCase()+' '+candidates.find(c=>c.id===id).name.slice(4)+(state.notes?'\n备注：'+state.notes:'');try{await navigator.clipboard.writeText(text);say('已选择 '+id.toUpperCase()+'，选择文字已复制；粘贴到聊天即可。');}catch{say('已选择 '+id.toUpperCase()+'；请直接在聊天里告诉我编号。');}}
$('#filters').innerHTML=candidates.map(c=>'<label><input type="checkbox" value="'+c.id+'">'+c.name+'</label>').join('');
$('#filters').addEventListener('change',e=>{const checked=$$('#filters input:checked').map(i=>i.value);if(!checked.length){e.target.checked=true;say('至少保留一个方向。');return;}state.visible=checked;save();renderGrid();});
document.addEventListener('click',e=>{const openButton=e.target.closest('[data-open]'),pickButton=e.target.closest('[data-pick]'),switchButton=e.target.closest('[data-switch]'),sizeButton=e.target.closest('[data-size]');if(openButton)open(openButton.dataset.open);if(pickButton)pick(pickButton.dataset.pick);if(switchButton)open(switchButton.dataset.switch);if(sizeButton){state.size=sizeButton.dataset.size;save();fitCards();fitSingle();syncState();}});
$('#close').addEventListener('click',close);$('#baseline-button').addEventListener('click',()=>open('baseline'));$('#prev').addEventListener('click',()=>move(-1));$('#next').addEventListener('click',()=>move(1));$('#actual').addEventListener('click',()=>{actual=!actual;fitSingle();});$('#notes').value=state.notes;$('#notes').addEventListener('input',e=>{state.notes=e.target.value;save();const m=$('#modal-notes');if(m)m.value=state.notes;});
$('#current').addEventListener('click',()=>{if(!state.chosen)return;state.chosen=null;save();syncState();say('已清除选择。');});
document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Escape'){close();return;}if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}if(e.key==='ArrowRight'){e.preventDefault();move(1);}if(e.key.toLowerCase()==='p')pick(currentId);if(e.key==='Tab'){const focusables=Array.from($('#overlay').querySelectorAll('button:not(:disabled),textarea,iframe')),first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
new ResizeObserver(()=>{fitCards();fitSingle();}).observe(document.body);window.addEventListener('resize',()=>{fitCards();fitSingle();});renderGrid();
</script>
</body>
